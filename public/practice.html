<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#040817">
<title>미니게임 연습 — 야외 마피아</title>
<script src="/kakao.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@700;900&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
<div id="app"><main>
  <h1>🎮 미니게임 연습</h1>
  <p class="muted">게임 중 장소 QR을 찍으면 나오는 미니게임입니다. 방에 들어가지 않아도 마음껏 해 볼 수 있고, 기록은 남지 않습니다.</p>
  <div class="grid2" id="list"></div>
  <button class="primary" id="rand" style="margin-top:14px">🎲 무작위로 하나</button>
  <div class="card" id="best" style="margin-top:14px"><h3>이 휴대폰 기록</h3><p class="small muted">아직 없습니다.</p></div>
  <p class="center small"><a href="/" style="color:var(--accent)">참가자 화면으로</a></p>
</main></div>
<script src="/common.js"></script>
<script src="/games.js"></script>
<script>
'use strict';
// 서버(lib/game.js makeChallenge)와 같은 규칙으로 문제를 만듭니다. 연습이라 결과를 서버로 보내지 않습니다.
const r = (n) => Math.floor(Math.random() * n);
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = r(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const MAKE = {
  fire: () => ({ hp: 3, spots: shuffle([...Array(20).keys()]).slice(0, 12).map(i => ({ x: (i % 4) * 24 + 12 + r(6), y: Math.floor(i / 4) * 18 + 12 + r(6) })) }),
  power: () => { const w = ['red', 'orange', 'yellow', 'green', 'blue', 'purple', 'pink', 'white']; return { left: shuffle(w), right: shuffle(w) }; },
  lock: () => { const code = []; let prev = 0; while (code.length < 6) { const n = r(20), g = Math.abs(n - prev); if (Math.min(g, 20 - g) >= 4) { code.push(n); prev = n; } } return { code }; },
  order: () => ({ layout: shuffle([...Array(25)].map((_, i) => i + 1)) }),
  lens: () => ({ wipe: 0.22, speed: 1000 }),
  sort: () => ({ boxes: Array.from({ length: 16 }, () => ['red', 'blue', 'yellow', 'green'][r(4)]) }),
  level: () => ({ hold: 4000, targets: [0, 1, 2].map(() => ({ base: 30 + r(41), amp: 10 + r(9), period: 5000 + r(3000), phase: r(628) / 100 })) }),
  mole: () => { const seq = []; let prev = -1; while (seq.length < 80) { const n = r(9); if (n !== prev) { seq.push(n); prev = n; } } return { hits: 20, show: 1100, seq }; },
  cards: () => { const icons = shuffle(['🍎', '🍌', '🍇', '🍉', '🍒', '🥝', '🍑', '🍋']).slice(0, 6); return { deck: shuffle(icons.concat(icons)) }; },
  shape: () => { const set = ['circle', 'triangle', 'square', 'star'].flatMap(s => ['blue', 'orange'].map(c => ({ s, c }))); return { pieces: shuffle(set), holes: shuffle(set) }; },
};
const best = store.get('mafia:practice') || {};
function drawBest() {
  const rows = Object.keys(GAME_NAME).filter(k => best[k]).map(k => `<li><span class="name">${GAME_NAME[k]}</span><b>${(best[k] / 1000).toFixed(1)}초</b></li>`);
  $('#best').innerHTML = '<h3>이 휴대폰 최고 기록</h3>' + (rows.length ? `<ul class="list">${rows.join('')}</ul>` : '<p class="small muted">아직 없습니다.</p>');
}
function play(kind) {
  const t0 = Date.now();
  Games.open({ game: kind, data: MAKE[kind]() }, () => {
    const ms = Date.now() - t0 - 700; // 완료 표시(0.7초) 제외
    const isBest = !best[kind] || ms < best[kind];
    if (isBest) { best[kind] = ms; store.set('mafia:practice', best); drawBest(); }
    toast(`✅ ${GAME_NAME[kind]} 완료 · ${(ms / 1000).toFixed(1)}초${isBest ? ' 🏆 최고 기록!' : ''}`, 'good', 3000);
  });
}
$('#list').innerHTML = Object.entries(GAME_NAME).map(([k, n]) => `<button data-g="${k}" style="min-height:84px">${n}</button>`).join('');
$('#list').addEventListener('click', (e) => { const b = e.target.closest('[data-g]'); if (b) play(b.dataset.g); });
$('#rand').onclick = () => { const ks = Object.keys(GAME_NAME); play(ks[r(ks.length)]); };
drawBest();
</script>
</body>
</html>
